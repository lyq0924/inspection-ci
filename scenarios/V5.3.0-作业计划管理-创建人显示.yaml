web:
  url: "${SOC_URL}"
  viewportWidth: 1401
  viewportHeight: 694
  bridgeMode: currentTab
  acceptInsecureCerts: true

# =============================================
# V5.3.0 作业计划管理 - 创建人显示回归
# 覆盖: 排班计划管理 新增 + 创建人/最近更新人字段验证
# =============================================
tasks:
  - name: "排班计划管理-新增、创建人、最近更新人显示"
    flow:
      # 导航到排班计划管理
      - aiTap: 安全运营
      - aiTap: 作业计划管理
      - aiTap: 排班计划管理
      # 新增排班计划
      - aiTap: 新增
      - aiInput: 排班名称输入框
        value: "autotest-${DATE}-001"
      - aiTap: 常态化
      # 选择排班时间：开始日期选当前日期，结束日期选本周五
      - aiTap: 开始时间输入框
      - aiTap: 当前日期
      - aiTap: 结束时间输入框
      - aiTap: 本周五的日期
      - aiTap: 提交
      - aiAssert: 页面出现"新增成功"的提示
      # 验证列表字段
      - aiAction: 查看列表中最新一条排班计划的创建人和最近更新人字段
      - aiAssert: 列表创建人、最近更新人展示与右上角登录用户一致，不显示为ID
