# ============================================
# 二级SOC平台管理端 — 全量巡检场景
# ============================================
# 基于 二级soc平台-管理端-菜单结构.txt 生成
# 一级菜单: 态势大屏 / 安全总览 / 安全运营 / 场景化运营 / 作业计划管理 / 安全服务 / 安全管理 / 系统设置
#
# 断言类型:
#   - 页面正常: JS异常=0
#   - 接口正常: HTTP 4xx/5xx=0
#   - 控制台正常: console.error=0
#   - UI正常: AI 视觉检测渲染
#   - 自定义: 如 "表格有数据"（AI 判断）
# ============================================

config:
  page_load_wait: 3000
  page_load_timeout: 30000
  network_idle_wait: 5000
  screenshot_quality: medium
  record_network: true

prerequisite:
  name: "导航到管理端"
  steps:
    - "打开管理端首页"
    - "如果页面在登录页，等待用户手动登录完成"

